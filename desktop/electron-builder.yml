appId: io.dsc.desktop
productName: Muse Code
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: runtime-staging/dsc-core
    to: dsc-core
  # 托盘图标（主进程用 process.resourcesPath/icon.png 加载）
  - from: build/icon.png
    to: icon.png
afterPack: scripts/after-pack.cjs
asar: true
win:
  target:
    - target: nsis
    - target: portable
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: muse-code-setup-${version}.${ext}
portable:
  artifactName: muse-code-portable-${version}.${ext}
